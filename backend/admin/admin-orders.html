<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Orders - Admin Panel</title>
    <link rel="stylesheet" href="../../public/css/styles.css">
    <style>
        :root {
            --admin-dark: #191919;
            --admin-gold: #B88746;
            --admin-gold-soft: #F7C873;
            --admin-ivory: #F8F8F8;
            --admin-neutral: #f3f0eb;
            --admin-border: rgba(184, 135, 70, 0.25);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: var(--admin-neutral);
            color: var(--admin-dark);
        }

        .admin-container {
            display: flex;
            min-height: 100vh;
            background: var(--admin-neutral);
        }

        .admin-sidebar {
            width: 280px;
            background: linear-gradient(180deg, #171717 0%, #1f1d1d 100%);
            color: var(--admin-ivory);
            padding: 0;
            border-right: 1px solid var(--admin-border);
            box-shadow: 8px 0 24px rgba(0, 0, 0, 0.12);
        }

        .admin-brand {
            padding: 1.75rem 1.5rem 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .admin-brand img {
            height: 56px;
            margin-bottom: 0.75rem;
            filter: drop-shadow(0 0 12px rgba(247, 200, 115, 0.22));
        }

        .admin-brand h3 {
            color: var(--admin-gold-soft);
            margin: 0;
            font-size: 1.05rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .admin-sidebar nav { padding: 1.25rem 0 0; }

        .admin-sidebar a {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            padding: 1rem 1.5rem;
            color: rgba(255,255,255,0.88);
            text-decoration: none;
            border-left: 4px solid transparent;
            transition: all 0.25s ease;
            font-weight: 500;
        }

        .admin-sidebar a:hover,
        .admin-sidebar a.active {
            background: linear-gradient(90deg, rgba(184, 135, 70, 0.25), rgba(184, 135, 70, 0.08));
            color: var(--admin-gold-soft);
            border-left-color: var(--admin-gold-soft);
            font-weight: 600;
        }

        .admin-content {
            flex: 1;
            padding: 2.4rem 2.8rem 3rem;
            background: var(--admin-neutral);
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .admin-title {
            margin: 0;
            font-size: clamp(2.2rem, 2.5vw, 3.5rem);
            line-height: 1.08;
            font-weight: 800;
            letter-spacing: -0.04em;
            color: var(--admin-dark);
        }

        .table-responsive {
            overflow-x: auto;
            background: rgba(255,255,255,0.7);
            border: 1px solid rgba(25,25,25,0.06);
            border-radius: 16px;
            box-shadow: 0 10px 22px rgba(0,0,0,0.04);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: rgba(255,255,255,0.85);
            min-width: 820px;
        }

        th {
            background: linear-gradient(180deg, #f8eac6 0%, #f3d89e 100%);
            color: var(--admin-dark);
            padding: 1rem 1.2rem;
            text-align: left;
            font-weight: 700;
        }

        td {
            padding: 1rem 1.2rem;
            border-bottom: 1px solid rgba(25,25,25,0.08);
            background: rgba(255,255,255,0.4);
        }

        tr:hover td {
            background-color: rgba(247, 200, 115, 0.08);
        }

        .badge {
            display: inline-block;
            padding: 0.35rem 0.7rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: capitalize;
        }

        .badge-success { background: rgba(40, 167, 69, 0.12); color: #1e7d46; }
        .badge-warning { background: rgba(255, 193, 7, 0.12); color: #7a5700; }
        .badge-danger { background: rgba(220, 53, 69, 0.12); color: #b3242f; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.1rem;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--admin-gold) 0%, #cb9a60 100%);
            color: var(--admin-dark);
            box-shadow: 0 8px 18px rgba(184, 135, 70, 0.22);
        }

        @media (max-width: 820px) {
            .admin-container { flex-direction: column; }
            .admin-sidebar { width: 100%; }
            .admin-content { padding: 1.5rem 1rem 2rem; }
            .admin-header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-sidebar">
            <div class="admin-brand">
                <img src="../../public/images/sv.jpeg" alt="Suvan Ventures">
                <h3>Admin Panel</h3>
            </div>
            <nav>
                <a href="admin-dashboard.html">📊 Dashboard</a>
                <a href="admin-products.html">📦 Products</a>
                <a href="admin-services.html">⚙️ Services</a>
                <a href="admin-inquiries.html">💬 Inquiries</a>
                <a href="admin-appointments.html">📅 Appointments</a>
                <a href="admin-orders.html" class="active">📋 Orders</a>
                <a href="#" onclick="logoutAndRedirect()">🚪 Logout</a>
            </nav>
        </div>

        <div class="admin-content">
            <div class="admin-header">
                <h1 class="admin-title">Customer Orders</h1>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Order #</th>
                            <th>Customer</th>
                            <th>Total Amount</th>
                            <th>Order Status</th>
                            <th>Payment Status</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTable">
                        <tr><td colspan="7" class="text-center">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../../public/js/common.js"></script>
    <script>
        async function checkAdminAccess() {
            const auth = await checkAuth();
            if (!auth.data.logged_in || (auth.data.user_role !== 'admin' && auth.data.user_role !== 'system_admin')) {
                window.location.href = '../../login.html';
            }
        }

        checkAdminAccess();
    </script>
</body>
</html>
