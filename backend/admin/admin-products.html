<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products - Admin Panel</title>
    <link rel="stylesheet" href="../../public/css/styles.css?v=20261012-background">
    <style>
        :root {
            --admin-dark: #191919;
            --admin-dark-alt: #222222;
            --admin-gold: #B88746;
            --admin-gold-soft: #F7C873;
            --admin-ivory: #F8F8F8;
            --admin-cream: #FAEBCD;
            --admin-border: rgba(184, 135, 70, 0.25);
            --admin-neutral: #f3f0eb;
            --admin-white: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: var(--admin-neutral);
            color: var(--admin-dark);
        }

        .admin-container {
            display: flex;
            min-height: 100vh;
            background: var(--admin-neutral);
        }

        .admin-sidebar {
            width: 280px;
            background: linear-gradient(180deg, #171717 0%, #1f1d1d 100%);
            color: var(--admin-ivory);
            padding: 0;
            border-right: 1px solid var(--admin-border);
            box-shadow: 8px 0 24px rgba(0, 0, 0, 0.12);
        }

        .admin-brand {
            padding: 1.75rem 1.5rem 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .admin-brand img {
            height: 56px;
            margin-bottom: 0.75rem;
            filter: drop-shadow(0 0 12px rgba(247, 200, 115, 0.22));
        }

        .admin-brand h3 {
            color: var(--admin-gold-soft);
            margin: 0;
            font-size: 1.05rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .admin-sidebar nav {
            padding: 1.25rem 0 0;
        }

        .admin-sidebar a {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            padding: 1rem 1.5rem;
            color: rgba(255,255,255,0.88);
            text-decoration: none;
            transition: all 0.25s ease;
            border-left: 4px solid transparent;
            font-weight: 500;
            font-size: 1.02rem;
        }

        .admin-sidebar a:hover,
        .admin-sidebar a.active {
            background: linear-gradient(90deg, rgba(184, 135, 70, 0.25), rgba(184, 135, 70, 0.08));
            color: var(--admin-gold-soft);
            border-left-color: var(--admin-gold-soft);
            font-weight: 600;
        }

        .admin-content {
            flex: 1;
            padding: 2.4rem 2.8rem 3rem;
            background: var(--admin-neutral);
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .admin-title {
            margin: 0;
            font-size: clamp(2.4rem, 3vw, 4rem);
            line-height: 1.08;
            font-weight: 800;
            letter-spacing: -0.04em;
            color: var(--admin-dark);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 8px;
            padding: 0.9rem 1.4rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--admin-gold) 0%, #cb9a60 100%);
            color: var(--admin-dark);
            box-shadow: 0 8px 18px rgba(184, 135, 70, 0.22);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 20px rgba(184, 135, 70, 0.28);
        }

        .table-responsive {
            overflow-x: auto;
            background: rgba(255,255,255,0.7);
            border: 1px solid rgba(25,25,25,0.06);
            border-radius: 16px;
            box-shadow: 0 10px 22px rgba(0,0,0,0.04);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: rgba(255,255,255,0.85);
            min-width: 700px;
        }

        th {
            background: linear-gradient(180deg, #f8eac6 0%, #f3d89e 100%);
            color: var(--admin-dark);
            padding: 1rem 1.2rem;
            text-align: left;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        td {
            padding: 1rem 1.2rem;
            border-bottom: 1px solid rgba(25,25,25,0.08);
            background: rgba(255,255,255,0.4);
        }

        tr:hover td {
            background-color: rgba(247, 200, 115, 0.08);
        }

        .badge {
            display: inline-block;
            padding: 0.35rem 0.7rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: capitalize;
        }

        .badge-success {
            background: rgba(40, 167, 69, 0.12);
            color: #1e7d46;
        }

        .badge-danger {
            background: rgba(220, 53, 69, 0.12);
            color: #b3242f;
        }

        .btn-small {
            padding: 0.5rem 0.8rem;
            font-size: 0.8rem;
            border-radius: 6px;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(17, 17, 17, 0.65);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(180deg, #fffdf9 0%, #f7f3ed 100%);
            border-radius: 16px;
            padding: 2rem;
            width: min(700px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 24px 50px rgba(0, 0, 0, 0.22);
            border: 1px solid rgba(184, 135, 70, 0.22);
        }

        .modal-content h2 {
            margin-top: 0;
            font-size: 2rem;
            color: var(--admin-dark);
        }

        .modal-close {
            float: right;
            font-size: 2rem;
            cursor: pointer;
            color: var(--admin-dark);
            background: transparent;
            border: none;
            line-height: 1;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1rem;
        }

        label {
            font-weight: 600;
            color: var(--admin-dark);
        }

        input, textarea, select {
            width: 100%;
            padding: 0.8rem 0.9rem;
            border: 1px solid rgba(25,25,25,0.15);
            border-radius: 10px;
            background: #fff;
            font-size: 1rem;
            color: var(--admin-dark);
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--admin-gold);
            box-shadow: 0 0 0 3px rgba(184, 135, 70, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 110px;
        }

        @media (max-width: 820px) {
            .admin-container {
                flex-direction: column;
            }

            .admin-sidebar {
                width: 100%;
            }

            .admin-content {
                padding: 1.5rem 1rem 2rem;
            }

            .admin-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <div class="admin-sidebar">
            <div class="admin-brand">
                <img src="../../public/images/sv.jpeg" alt="Suvan Ventures">
                <h3>Admin Panel</h3>
            </div>
            <nav>
                <a href="admin-dashboard.html">📊 Dashboard</a>
                <a href="admin-products.html" class="active">📦 Products</a>
                <a href="admin-services.html">⚙️ Services</a>
                <a href="admin-inquiries.html">💬 Inquiries</a>
                <a href="admin-appointments.html">📅 Appointments</a>
                <a href="admin-orders.html">📋 Orders</a>
                <a href="#" onclick="logoutAndRedirect()">🚪 Logout</a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="admin-content">
            <div class="admin-header">
                <h1 class="admin-title">Manage Products</h1>
                <button class="btn btn-primary" onclick="openAddProductModal()">+ Add Product</button>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="productsTable">
                        <tr><td colspan="7" class="text-center">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add/Edit Product Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content" style="max-width: 700px;">
            <button class="modal-close" onclick="closeProductModal()">&times;</button>
            <h2 id="modalTitle">Add Product</h2>
            <form id="productForm" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="productName">Product Name *</label>
                    <input type="text" id="productName" required>
                </div>

                <div class="form-group">
                    <label for="productDescription">Description *</label>
                    <textarea id="productDescription" rows="4" required></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="productCategory">Category *</label>
                        <select id="productCategory" required>
                            <option value="">Select category</option>
                            <option value="Electronics">Electronics</option>
                            <option value="Networking">Networking</option>
                            <option value="Security">Security</option>
                            <option value="Accessories">Accessories</option>
                            <option value="IT Solutions">IT Solutions</option>
                            <option value="Software">Software</option>
                            <option value="Office Equipment">Office Equipment</option>
                            <option value="School Management">School Management</option>
                            <option value="POS Systems">POS Systems</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="productStock">Stock Quantity *</label>
                        <input type="number" id="productStock" min="0" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Pricing</label>
                    <div style="background-color: #f5f5f5; padding: 1rem; border-radius: 4px; margin-bottom: 1rem;">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="productPrice">Original Price *</label>
                                <input type="number" id="productPrice" step="0.01" min="0" required onchange="updateDiscountPercentage()">
                            </div>
                            <div class="form-group">
                                <label for="productDiscountPrice">Discounted Price</label>
                                <input type="number" id="productDiscountPrice" step="0.01" min="0" onchange="updateDiscountPercentage()">
                            </div>
                        </div>
                        <div style="margin-top: 0.5rem; padding: 0.5rem; background-color: white; border-radius: 4px;">
                            <small><strong>Discount:</strong> <span id="discountDisplay">0%</span></small>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="productImage">Product Image</label>
                    <div style="margin-bottom: 0.5rem;">
                        <input type="file" id="productImage" accept="image/*" onchange="previewImage()">
                    </div>
                    <div id="imagePreview" style="max-width: 200px; margin-top: 0.5rem;"></div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Save Product</button>
            </form>
        </div>
    </div>

    <script src="../../public/js/common.js"></script>
    <script>
        let currentProductId = null;

        async function loadProducts() {
            const result = await getAllProductsForAdmin();
            const tbody = document.getElementById('productsTable');
            tbody.innerHTML = '';

            if (result.success && result.data) {
                result.data.forEach(product => {
                    const displayPrice = product.discount_price ? `${formatCurrency(product.discount_price)} <small style="color: #999;"><s>${formatCurrency(product.price)}</s></small>` : formatCurrency(product.price);
                    
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${product.id}</td>
                        <td>${product.name}</td>
                        <td>${product.category}</td>
                        <td>${displayPrice}</td>
                        <td>${product.stock_quantity}</td>
                        <td><span class="badge ${product.status === 'active' ? 'badge-success' : 'badge-danger'}">${product.status}</span></td>
                        <td>
                            <button class="btn btn-primary btn-small" onclick="editProduct(${product.id}, '${product.name}', '${product.description}', ${product.price}, '${product.category}', ${product.stock_quantity}, ${product.discount_price || 'null'})">Edit</button>
                            <button class="btn btn-danger btn-small" onclick="deleteProduct(${product.id})">Delete</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
                if (result.data.length === 0) {
                    const row = document.createElement('tr');
                    const cell = document.createElement('td');
                    cell.colSpan = 7;
                    cell.className = 'text-center';
                    cell.textContent = 'No products found';
                    row.appendChild(cell);
                    tbody.appendChild(row);
                }
            } else {
                const row = document.createElement('tr');
                const cell = document.createElement('td');
                cell.colSpan = 7;
                cell.className = 'text-center';
                cell.textContent = result.success ? 'No products found' : result.message || 'Unable to load products.';
                row.appendChild(cell);
                tbody.appendChild(row);
            }
        }

        function previewImage() {
            const file = document.getElementById('productImage').files[0];
            const preview = document.getElementById('imagePreview');
            
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.innerHTML = `<img src="${e.target.result}" alt="Preview" style="max-width: 100%; border-radius: 4px;">`;
                };
                reader.readAsDataURL(file);
            } else {
                preview.innerHTML = '';
            }
        }

        function updateDiscountPercentage() {
            const originalPrice = parseFloat(document.getElementById('productPrice').value) || 0;
            const discountPrice = parseFloat(document.getElementById('productDiscountPrice').value) || 0;
            
            if (originalPrice > 0 && discountPrice > 0 && discountPrice < originalPrice) {
                const percentage = Math.round(((originalPrice - discountPrice) / originalPrice) * 100);
                document.getElementById('discountDisplay').textContent = percentage + '%';
            } else {
                document.getElementById('discountDisplay').textContent = '0%';
            }
        }

        function openAddProductModal() {
            currentProductId = null;
            document.getElementById('modalTitle').textContent = 'Add Product';
            document.getElementById('productForm').reset();
            document.getElementById('imagePreview').innerHTML = '';
            document.getElementById('discountDisplay').textContent = '0%';
            document.getElementById('productCategory').value = '';
            showModal('productModal');
        }

        function editProduct(id, name, description, price, category, stock, discountPrice) {
            currentProductId = id;
            document.getElementById('modalTitle').textContent = 'Edit Product';
            document.getElementById('productName').value = name;
            document.getElementById('productDescription').value = description;
            document.getElementById('productPrice').value = price;
            document.getElementById('productCategory').value = category;
            document.getElementById('productStock').value = stock;
            document.getElementById('productDiscountPrice').value = discountPrice || '';
            document.getElementById('imagePreview').innerHTML = '';
            updateDiscountPercentage();
            showModal('productModal');
        }

        function closeProductModal() {
            hideModal('productModal');
        }

        async function deleteProduct(id) {
            if (confirm('Are you sure you want to delete this product?')) {
                const result = await apiCall('products', 'delete_product', 'POST', { id });
                if (result.success) {
                    showAlert('Product deleted successfully', 'success');
                    loadProducts();
                } else {
                    showAlert(result.message, 'danger');
                }
            }
        }

        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData();
            formData.append('name', document.getElementById('productName').value);
            formData.append('description', document.getElementById('productDescription').value);
            formData.append('price', document.getElementById('productPrice').value);
            formData.append('discount_price', document.getElementById('productDiscountPrice').value || null);
            formData.append('category', document.getElementById('productCategory').value);
            formData.append('stock_quantity', document.getElementById('productStock').value);
            
            const imageFile = document.getElementById('productImage').files[0];
            if (imageFile) {
                formData.append('image', imageFile);
            }

            try {
                if (currentProductId) {
                    formData.append('id', currentProductId);
                }

                const response = await fetch('../../backend/api/products.php', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.success) {
                    showAlert(currentProductId ? 'Product updated successfully' : 'Product added successfully', 'success');
                    closeProductModal();
                    loadProducts();
                } else {
                    showAlert(result.message || 'Error saving product', 'danger');
                }
            } catch (error) {
                showAlert('Error saving product: ' + error.message, 'danger');
            }
        });

        async function checkAdminAccess() {
            const auth = await checkAuth();
            if (!auth.data.logged_in || (auth.data.user_role !== 'admin' && auth.data.user_role !== 'system_admin')) {
                window.location.href = '../../public/index.html?auth=login';
            }
        }

        checkAdminAccess();
        loadProducts();
    </script>
</body>
</html>
