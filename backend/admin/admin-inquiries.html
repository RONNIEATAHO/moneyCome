<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Inquiries - Admin Panel</title>
    <link rel="stylesheet" href="../../public/css/styles.css?v=20261013-admin-feedback">
    <style>
        :root {
            --admin-dark: #191919;
            --admin-gold: #B88746;
            --admin-gold-soft: #F7C873;
            --admin-ivory: #F8F8F8;
            --admin-neutral: #f3f0eb;
            --admin-border: rgba(184, 135, 70, 0.25);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: var(--admin-neutral);
            color: var(--admin-dark);
        }

        .admin-container {
            display: flex;
            min-height: 100vh;
            background: var(--admin-neutral);
        }

        .admin-sidebar {
            width: 280px;
            background: linear-gradient(180deg, #171717 0%, #1f1d1d 100%);
            color: var(--admin-ivory);
            padding: 0;
            border-right: 1px solid var(--admin-border);
            box-shadow: 8px 0 24px rgba(0, 0, 0, 0.12);
        }

        .admin-brand {
            padding: 1.75rem 1.5rem 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .admin-brand img {
            height: 56px;
            margin-bottom: 0.75rem;
            filter: drop-shadow(0 0 12px rgba(247, 200, 115, 0.22));
        }

        .admin-brand h3 {
            color: var(--admin-gold-soft);
            margin: 0;
            font-size: 1.05rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .admin-sidebar nav { padding: 1.25rem 0 0; }

        .admin-sidebar a {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            padding: 1rem 1.5rem;
            color: rgba(255,255,255,0.88);
            text-decoration: none;
            border-left: 4px solid transparent;
            transition: all 0.25s ease;
            font-weight: 500;
        }

        .admin-sidebar a:hover,
        .admin-sidebar a.active {
            background: linear-gradient(90deg, rgba(184, 135, 70, 0.25), rgba(184, 135, 70, 0.08));
            color: var(--admin-gold-soft);
            border-left-color: var(--admin-gold-soft);
            font-weight: 600;
        }

        .admin-content {
            flex: 1;
            padding: 2.4rem 2.8rem 3rem;
            background: var(--admin-neutral);
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .admin-title {
            margin: 0;
            font-size: clamp(2.2rem, 2.5vw, 3.5rem);
            line-height: 1.08;
            font-weight: 800;
            letter-spacing: -0.04em;
            color: var(--admin-dark);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 8px;
            padding: 0.85rem 1.2rem;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--admin-gold) 0%, #cb9a60 100%);
            color: var(--admin-dark);
            box-shadow: 0 8px 18px rgba(184, 135, 70, 0.22);
        }

        .btn-small {
            padding: 0.5rem 0.8rem;
            font-size: 0.8rem;
            border-radius: 6px;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .table-responsive {
            overflow-x: auto;
            background: rgba(255,255,255,0.7);
            border: 1px solid rgba(25,25,25,0.06);
            border-radius: 16px;
            box-shadow: 0 10px 22px rgba(0,0,0,0.04);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: rgba(255,255,255,0.85);
            min-width: 820px;
        }

        th {
            background: linear-gradient(180deg, #f8eac6 0%, #f3d89e 100%);
            color: var(--admin-dark);
            padding: 1rem 1.2rem;
            text-align: left;
            font-weight: 700;
        }

        td {
            padding: 1rem 1.2rem;
            border-bottom: 1px solid rgba(25,25,25,0.08);
            background: rgba(255,255,255,0.4);
        }

        tr:hover td {
            background-color: rgba(247, 200, 115, 0.08);
        }

        .badge {
            display: inline-block;
            padding: 0.35rem 0.7rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: capitalize;
        }

        .badge-success { background: rgba(40, 167, 69, 0.12); color: #1e7d46; }
        .badge-danger { background: rgba(220, 53, 69, 0.12); color: #b3242f; }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(17, 17, 17, 0.65);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .modal.show { display: flex; }

        .modal-content {
            background: linear-gradient(180deg, #fffdf9 0%, #f7f3ed 100%);
            border-radius: 16px;
            padding: 2rem;
            width: min(700px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 24px 50px rgba(0, 0, 0, 0.22);
            border: 1px solid rgba(184, 135, 70, 0.22);
        }

        .modal-close {
            float: right;
            font-size: 2rem;
            cursor: pointer;
            color: var(--admin-dark);
            background: transparent;
            border: none;
            line-height: 1;
        }

        .form-group { margin-bottom: 1rem; }
        label { font-weight: 600; display: block; margin-bottom: 0.5rem; }
        select {
            width: 100%;
            padding: 0.8rem 0.9rem;
            border: 1px solid rgba(25,25,25,0.15);
            border-radius: 10px;
            background: #fff;
            color: var(--admin-dark);
        }

        @media (max-width: 820px) {
            .admin-container { flex-direction: column; }
            .admin-sidebar { width: 100%; }
            .admin-content { padding: 1.5rem 1rem 2rem; }
            .admin-header { flex-direction: column; align-items: flex-start; }
        }
    </style>
    <link rel="stylesheet" href="admin-mobile.css?v=20261013-admin-mobile">
</head>
<body>
    <div class="admin-container">
        <div class="admin-sidebar">
            <div class="admin-brand">
                <img src="../../public/images/sv.jpeg" alt="Suvan Ventures">
                <h3>Admin Panel</h3>
            </div>
            <nav>
                <a href="admin-dashboard.html">📊 Dashboard</a>
                <a href="admin-products.html">📦 Products</a>
                <a href="admin-services.html">⚙️ Services</a>
                <a href="admin-inquiries.html" class="active">💬 Inquiries</a>
                <a href="admin-appointments.html">📅 Appointments</a>
                <a href="admin-orders.html">📋 Orders</a>
                <a href="#" onclick="logoutAndRedirect()">🚪 Logout</a>
            </nav>
        </div>

        <div class="admin-content">
            <div class="admin-header">
                <h1 class="admin-title">Customer Inquiries</h1>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Subject</th>
                            <th>Service Type</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="inquiriesTable">
                        <tr><td colspan="8" class="text-center">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="inquiryModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeInquiryModal()">&times;</button>
            <h2>Inquiry Details</h2>
            <div id="inquiryDetails" style="margin: 2rem 0;">
                <!-- Details will be loaded here -->
            </div>
            <div class="form-group">
                <label for="inquiryStatus">Update Status:</label>
                <select id="inquiryStatus">
                    <option value="new">New</option>
                    <option value="read">Read</option>
                    <option value="responded">Responded</option>
                    <option value="resolved">Resolved</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="updateInquiryStatus()">Update Status</button>
        </div>
    </div>

    <script src="../../public/js/common.js?v=20261013-admin-feedback"></script>
    <script>
        let currentInquiry = null;

        async function loadInquiries() {
            const result = await getAllInquiries();
            const tbody = document.getElementById('inquiriesTable');
            tbody.innerHTML = '';

            if (result.success && result.data) {
                result.data.forEach(inquiry => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${inquiry.id}</td>
                        <td>${inquiry.name}</td>
                        <td>${inquiry.email}</td>
                        <td>${inquiry.subject}</td>
                        <td>${inquiry.service_type || 'N/A'}</td>
                        <td><span class="badge ${inquiry.status === 'new' ? 'badge-danger' : 'badge-success'}">${inquiry.status}</span></td>
                        <td>${formatDate(inquiry.created_at)}</td>
                        <td>
                            <button class="btn btn-primary btn-small" onclick="viewInquiry(${inquiry.id})">View</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center">No inquiries found</td></tr>';
            }
        }

        async function viewInquiry(id) {
            const result = await getInquiry(id);
            if (result.success) {
                currentInquiry = result.data;
                document.getElementById('inquiryDetails').innerHTML = `
                    <p><strong>Name:</strong> ${result.data.name}</p>
                    <p><strong>Email:</strong> ${result.data.email}</p>
                    <p><strong>Phone:</strong> ${result.data.phone || 'N/A'}</p>
                    <p><strong>Subject:</strong> ${result.data.subject}</p>
                    <p><strong>Service Type:</strong> ${result.data.service_type || 'N/A'}</p>
                    <p><strong>Date:</strong> ${formatDateTime(result.data.created_at)}</p>
                    <hr>
                    <p><strong>Message:</strong></p>
                    <p style="background-color: rgba(184, 135, 70, 0.08); padding: 1rem; border-radius: 8px; white-space: pre-wrap;">${result.data.message}</p>
                `;
                document.getElementById('inquiryStatus').value = result.data.status;
                showModal('inquiryModal');
            }
        }

        function closeInquiryModal() { hideModal('inquiryModal'); }

        async function updateInquiryStatus() {
            const status = document.getElementById('inquiryStatus').value;
            const result = await updateInquiryStatus(currentInquiry.id, status);
            if (result.success) {
                showAlert('Inquiry status updated', 'success');
                closeInquiryModal();
                loadInquiries();
            } else {
                showAlert('Failed to update status', 'danger');
            }
        }

        async function checkAdminAccess() {
            const auth = await checkAuth();
            if (!auth.data.logged_in || (auth.data.user_role !== 'admin' && auth.data.user_role !== 'system_admin')) {
                window.location.href = '../../public/index.html?auth=login';
            }
        }

        checkAdminAccess();
        loadInquiries();
    </script>
</body>
</html>
